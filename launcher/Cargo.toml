[package]
name = "stellaria-launcher"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Stellaria launcher"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
minisign-verify = "0.3"
sha2 = "0.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
