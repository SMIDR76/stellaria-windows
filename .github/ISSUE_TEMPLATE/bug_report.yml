name: Bug report
description: Something in Stellaria does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not open an issue: use the Security tab > Report a vulnerability.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: In the Stellaria app, Help > Troubleshooting > Copy a report, then paste it here. Remove anything you do not want to share.
      render: text
  - type: input
    id: version
    attributes:
      label: Stellaria version
      placeholder: '1.0.0'
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Check that they show nothing private.
