version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /helper
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /launcher
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '@material/material-color-utilities'
      - dependency-name: 'cldr-*'
      - dependency-name: unicode-emoji-json
      - dependency-name: '@fontsource-variable/*'
      - dependency-name: material-symbols
