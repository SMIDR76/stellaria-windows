name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  helper:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: helper/global.json
      - name: Test
        working-directory: helper/tests/Stellaria.Helper.Tests
        run: dotnet test .

  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax
        run: find pack -name '*.js' -not -path 'pack/vendor/*' -print0 | xargs -0 -n1 node --check
      - run: npm run lint
      - run: npm test
