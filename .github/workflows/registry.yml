name: Registry

on:
  push:
    paths: ['registry/**', 'helper/tools/Caelestia.Registry/**', 'helper/src/Caelestia.Helper/Catalog/**', 'helper/src/Caelestia.Helper/Security/**']
  pull_request:
    paths: ['registry/**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: helper/global.json
      - name: Validate the entries
        run: dotnet run --project helper/tools/Caelestia.Registry -c Release -- validate registry
      - name: Build and sign the index
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CAELESTIA_SIGNING_KEY: ${{ secrets.CAELESTIA_SIGNING_KEY }}
        run: |
          if [ -z "$CAELESTIA_SIGNING_KEY" ]; then echo "No signing key configured, skipping."; exit 0; fi
          dotnet run --project helper/tools/Caelestia.Registry -c Release -- build registry site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: registry-index
          path: site/
          if-no-files-found: ignore
