name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: helper/global.json
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $version = ([xml](Get-Content helper/Directory.Build.props)).Project.PropertyGroup.Version + "-dev.$env:GITHUB_RUN_NUMBER" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build
        shell: pwsh
        env:
          CAELESTIA_SIGNING_KEY: ${{ secrets.CAELESTIA_SIGNING_KEY }}
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Check native dependencies
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          foreach ($file in 'artifacts/stage/bin/caelestia-helper.exe', 'artifacts/stage/bin/e_sqlite3.dll') {
            $imports = & $dumpbin /nologo /dependents $file | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
            $imports
            if ($imports -match '(?i)^(vcruntime|msvcp)') { throw "$file needs the Visual C++ runtime." }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: caelestia-${{ steps.version.outputs.value }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release
          merge-multiple: true
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release/*.exe
            release/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "Caelestia for Windows ${TAG#v}" release/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
