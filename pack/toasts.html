<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caelestia toasts</title>
    <link rel="stylesheet" href="./common.css" />
    <style>
      body {
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        gap: 8px;
        padding: 16px 16px 20px;
      }

      .toast {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 240px;
        max-width: 360px;
        padding: 10px 18px 10px 10px;
        border-radius: 28px;
        background: var(--m3-surface-container);
        color: var(--m3-on-surface);
        box-shadow: 0 6px 20px color-mix(in srgb, var(--m3-shadow) 35%, transparent);
        transform: translateX(calc(100% + 40px));
        opacity: 0;
        transition:
          transform var(--duration-spatial) var(--ease-spatial),
          opacity var(--duration-effects) var(--ease-effects),
          margin var(--duration-spatial) var(--ease-spatial);
      }

      .toast.shown {
        transform: none;
        opacity: 1;
      }

      .toast.leaving {
        transform: translateX(calc(100% + 40px));
        opacity: 0;
        transition:
          transform var(--duration-spatial-fast) var(--ease-emphasized-accel),
          opacity var(--duration-spatial-fast) var(--ease-standard);
      }

      .toast-icon {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: var(--m3-primary-container);
        color: var(--m3-on-primary-container);
      }

      .toast.warning .toast-icon {
        background: var(--m3-error-container);
        color: var(--m3-on-error-container);
      }

      .toast-icon .icon {
        font-size: 22px;
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      .toast-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .toast-title {
        font-size: 14px;
        font-weight: 500;
      }

      .toast-message {
        font-size: 12.5px;
        color: var(--m3-on-surface-variant);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { cursorOnCurrentMonitor, element, getOption, hideOnFullscreen, icon, initTheme, keys, store, zebar } from './common.js';

      initTheme();
      hideOnFullscreen();
      await zebar.currentWidget().tauriWindow.setIgnoreCursorEvents(true);

      const maximum = 4;
      const startedAt = Date.now();

      const dismiss = node => {
        if (node.classList.contains('leaving')) return;
        node.classList.add('leaving');
        setTimeout(() => node.remove(), 380);
      };

      const show = async toast => {
        if (!toast || toast.at < startedAt || Date.now() - toast.at > 4000 || !getOption('toasts', true)) return;
        if (!(await cursorOnCurrentMonitor())) return;
        const node = element('div', { class: `toast${toast.kind === 'warning' ? ' warning' : ''}` }, [
          element('span', { class: 'toast-icon' }, icon(toast.icon ?? 'info')),
          element('span', { class: 'toast-text' }, [
            element('span', { class: 'toast-title', text: toast.title }),
            toast.message ? element('span', { class: 'toast-message', text: toast.message }) : null,
          ]),
        ]);
        document.body.append(node);
        requestAnimationFrame(() => requestAnimationFrame(() => node.classList.add('shown')));
        const visible = [...document.querySelectorAll('.toast:not(.leaving)')];
        visible.slice(0, Math.max(0, visible.length - maximum)).forEach(dismiss);
        setTimeout(() => dismiss(node), toast.duration ?? 3200);
      };

      store.watch(keys.toast, show, 120);
    </script>
  </body>
</html>
