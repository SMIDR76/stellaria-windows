<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caelestia session</title>
    <link rel="stylesheet" href="./common.css" />
    <style>
      .session {
        padding: 18px 18px 18px 18px;
      }

      .session-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .session-button {
        width: 84px;
        height: 84px;
        border-radius: var(--rounding);
        background: var(--m3-surface-container);
        color: var(--m3-on-surface);
        display: grid;
        place-items: center;
        transition:
          border-radius var(--duration-spatial) var(--ease-spatial),
          background var(--duration-short) var(--ease-standard),
          color var(--duration-short) var(--ease-standard);
      }

      .session-button .icon {
        font-size: 30px;
      }

      .session-button:focus-visible,
      .session-button.focused {
        background: var(--m3-secondary-container);
        color: var(--m3-on-secondary-container);
        border-radius: calc(var(--rounding) * 1.6);
      }

      .session-button.danger:focus-visible,
      .session-button.danger.focused {
        background: var(--m3-error-container);
        color: var(--m3-on-error-container);
      }

      .session-button.focused .icon {
        font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body>
    <div class="drawer from-right">
      <div class="drawer-anchor">
        <div class="flare start"></div>
        <section class="drawer-panel session" id="panel">
          <div class="drawer-content session-content" id="buttons">
            <button class="session-button state-layer" data-action="lock" title="Verrouiller"><span class="icon">lock</span></button>
            <button class="session-button state-layer" data-action="sleep" title="Veille"><span class="icon">bedtime</span></button>
            <button class="session-button state-layer" data-action="logout" title="Déconnexion"><span class="icon">logout</span></button>
            <button class="session-button state-layer danger" data-action="restart" title="Redémarrer"><span class="icon">restart_alt</span></button>
            <button class="session-button state-layer danger" data-action="shutdown" title="Éteindre"><span class="icon">power_settings_new</span></button>
          </div>
        </section>
        <div class="flare end"></div>
      </div>
    </div>

    <script type="module">
      import { helper, initTheme, setupPopup } from './common.js';

      initTheme();

      const buttons = [...document.querySelectorAll('.session-button')];
      let focused = 0;

      const focus = index => {
        focused = (index + buttons.length) % buttons.length;
        buttons.forEach((button, buttonIndex) => button.classList.toggle('focused', buttonIndex === focused));
        buttons[focused].focus({ preventScroll: true });
      };

      const popup = setupPopup('session', {
        panel: document.getElementById('panel'),
        onOpen: () => focus(0),
      });

      const run = async action => {
        const request = helper('power', action);
        await Promise.race([request, new Promise(resolve => setTimeout(resolve, 500))]);
        await popup.close();
      };

      buttons.forEach((button, index) => {
        button.addEventListener('mouseenter', () => focus(index));
        button.addEventListener('click', () => run(button.dataset.action));
      });

      window.addEventListener('keydown', event => {
        if (event.key === 'ArrowDown' || event.key === 'Tab') {
          event.preventDefault();
          focus(focused + 1);
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          focus(focused - 1);
        } else if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          run(buttons[focused].dataset.action);
        }
      });
    </script>
  </body>
</html>
