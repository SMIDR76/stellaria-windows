<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caelestia desktop clock</title>
    <link rel="stylesheet" href="./common.css" />
    <link rel="stylesheet" href="./desktop-clock.css" />
  </head>
  <body>
    <div class="clock" id="clock">
      <div class="time">
        <span class="hours" id="hours">00</span>
        <span class="colon">:</span>
        <span class="minutes" id="minutes">00</span>
      </div>
      <span class="divider"></span>
      <div class="date">
        <span class="month" id="month"></span>
        <span class="day" id="day"></span>
        <span class="weekday" id="weekday"></span>
      </div>
    </div>

    <script type="module" src="./desktop-clock.js"></script>
  </body>
</html>
