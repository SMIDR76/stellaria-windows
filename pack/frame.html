<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caelestia frame</title>
    <link rel="stylesheet" href="./common.css" />
    <style>
      body {
        pointer-events: none;
      }

      /* Le cadre recouvre les 2 premiers pixels de la zone des fenêtres : certaines applications (Chrome…) dessinent un
         liseré sur leurs bords quand elles sont agrandies, qui tranchait avec la couleur du cadre. Les bandes courent sur
         toute la longueur et les arrondis sont décalés d'autant vers l'intérieur : l'arc rejoint le bord sans marche. */
      :root {
        --seam: 2px;
      }

      .seam {
        position: fixed;
        background: var(--surface-base);
        transition: background var(--duration) var(--ease-standard);
      }

      .seam.top {
        top: var(--border);
        left: var(--bar);
        right: var(--border);
        height: var(--seam);
      }

      .seam.bottom {
        bottom: var(--border);
        left: var(--bar);
        right: var(--border);
        height: var(--seam);
      }

      .seam.left {
        top: var(--border);
        bottom: var(--border);
        left: var(--bar);
        width: var(--seam);
      }

      .seam.right {
        top: var(--border);
        bottom: var(--border);
        right: var(--border);
        width: var(--seam);
      }

      .corner {
        position: fixed;
        width: var(--rounding);
        height: var(--rounding);
        transition: background var(--duration) var(--ease-standard);
      }

      .corner.top-left {
        left: calc(var(--bar) + var(--seam));
        top: calc(var(--border) + var(--seam));
        background: radial-gradient(circle at 100% 100%, transparent calc(var(--rounding) - 0.5px), var(--surface-base) var(--rounding));
      }

      .corner.top-right {
        right: calc(var(--border) + var(--seam));
        top: calc(var(--border) + var(--seam));
        background: radial-gradient(circle at 0 100%, transparent calc(var(--rounding) - 0.5px), var(--surface-base) var(--rounding));
      }

      .corner.bottom-left {
        left: calc(var(--bar) + var(--seam));
        bottom: calc(var(--border) + var(--seam));
        background: radial-gradient(circle at 100% 0, transparent calc(var(--rounding) - 0.5px), var(--surface-base) var(--rounding));
      }

      .corner.bottom-right {
        right: calc(var(--border) + var(--seam));
        bottom: calc(var(--border) + var(--seam));
        background: radial-gradient(circle at 0 0, transparent calc(var(--rounding) - 0.5px), var(--surface-base) var(--rounding));
      }
    </style>
  </head>
  <body>
    <div class="seam top"></div>
    <div class="seam bottom"></div>
    <div class="seam left"></div>
    <div class="seam right"></div>
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <script type="module">
      import { hideOnFullscreen, initTheme, zebar } from './common.js';

      initTheme();
      hideOnFullscreen();
      zebar.currentWidget().tauriWindow.setIgnoreCursorEvents(true)
        .catch(error => console.error('[caelestia] Cadre non traversable', error));
    </script>
  </body>
</html>
