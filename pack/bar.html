<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stellaria bar</title>
    <link rel="stylesheet" href="./common.css" />
    <link rel="stylesheet" href="./bar.css" />
  </head>
  <body>
    <nav class="bar">
      <div class="section start">
        <button class="logo state-layer" id="logo" data-entry="logo" title="Lanceur d'applications">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 5.1 10.1 4.1v6.8H3zM11 4l10-1.4v8.3H11zM3 11.9h7.1v6.9L3 17.8zM11 11.9h10v8.4L11 18.9z" />
          </svg>
        </button>
        <div class="group workspaces" id="workspaces" data-entry="workspaces" hidden></div>
        <div class="group tasks" id="tasks" data-entry="tasks" hidden></div>
        <div class="active-window" id="active-window" data-entry="activeWindow" hidden>
          <span class="icon active-icon">select_window</span>
          <span class="active-title" id="active-title"></span>
        </div>
      </div>

      <div class="section end">
        <div class="group tray" id="tray" data-entry="tray" hidden></div>

        <button class="group weather state-layer" id="weather" data-entry="weather" title="Météo" hidden>
          <span class="icon" id="weather-icon">cloud</span>
          <span class="weather-temp" id="weather-temp">--°</span>
        </button>

        <button class="group clock state-layer" id="clock" data-entry="clock" title="Tableau de bord">
          <span class="icon">calendar_month</span>
          <span class="clock-digits" id="clock-hours">00</span>
          <span class="clock-digits" id="clock-minutes">00</span>
          <span class="clock-digits clock-seconds" id="clock-seconds" hidden>00</span>
        </button>

        <div class="group status" id="status" data-entry="status">
          <button class="status-item keyboard state-layer" id="keyboard" data-status="keyboard" title="Disposition du clavier">FR</button>
          <button class="status-item state-layer" id="caps-lock" data-status="capsLock" title="Verr. Maj activé" hidden>
            <span class="icon">keyboard_capslock_badge</span>
          </button>
          <button class="status-item state-layer" id="mic" data-status="mic" title="Micro">
            <span class="icon" id="mic-icon">mic</span>
          </button>
          <button class="status-item state-layer" id="volume" data-status="volume" title="Volume">
            <span class="icon" id="volume-icon">volume_up</span>
          </button>
          <button class="status-item state-layer" id="bluetooth" data-status="bluetooth" title="Bluetooth" hidden>
            <span class="icon" id="bluetooth-icon">bluetooth</span>
          </button>
          <button class="status-item battery state-layer" id="battery" data-status="battery" title="Batterie" hidden>
            <span class="icon" id="battery-icon">battery_full</span>
            <span class="battery-level" id="battery-level"></span>
          </button>
          <button class="status-item state-layer" id="network" data-status="network" title="Réseau">
            <span class="icon" id="network-icon">lan</span>
          </button>
          <button class="status-item notifications state-layer" id="notifications" data-status="notifications" title="Notifications">
            <span class="icon" id="notifications-icon">notifications</span>
            <span class="badge" id="notifications-badge" hidden></span>
          </button>
        </div>

        <button class="power state-layer" id="power" data-entry="power" title="Session">
          <span class="icon">power_settings_new</span>
        </button>
      </div>
    </nav>

    <script type="module" src="./bar.js"></script>
  </body>
</html>
