<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caelestia osd</title>
    <link rel="stylesheet" href="./common.css" />
    <style>
      body {
        pointer-events: none;
      }

      body.open .drawer,
      body.open .drawer * {
        pointer-events: auto;
      }

      .osd {
        padding: 16px 12px 16px 16px;
      }

      .osd-content {
        display: flex;
        gap: 12px;
      }

      .vslider {
        position: relative;
        width: 34px;
        height: 180px;
        border-radius: 17px;
        background: var(--m3-secondary-container);
        overflow: hidden;
        cursor: pointer;
        touch-action: none;
      }

      .vslider[hidden] {
        display: none;
      }

      .vslider-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 34px;
        border-radius: 17px;
        background: var(--m3-primary);
        transition: height var(--duration-effects) var(--ease-effects);
      }

      .vslider.dragging .vslider-fill {
        transition: none;
      }

      .vslider .icon {
        position: absolute;
        left: 50%;
        bottom: 7px;
        transform: translateX(-50%);
        font-size: 20px;
        color: var(--m3-on-primary);
        font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        pointer-events: none;
      }

      .vslider.muted .vslider-fill {
        background: var(--m3-error);
      }

      .vslider.muted .icon {
        color: var(--m3-on-error);
      }
    </style>
  </head>
  <body>
    <div class="drawer from-right">
      <div class="drawer-anchor">
        <div class="flare start"></div>
        <section class="drawer-panel osd" id="panel">
          <div class="drawer-content osd-content" id="sliders"></div>
        </section>
        <div class="flare end"></div>
      </div>
    </div>

    <script type="module" src="./osd.js"></script>
  </body>
</html>
